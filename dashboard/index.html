<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Syne:wght@700;800&family=Rajdhani:wght@400;500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    
    <title>GHOST TRAIL - Perimeter Defense Dashboard</title>

    <style>
      /* --- SPLASH SCREEN STYLES --- */
      #sentinel-splash {
        position: fixed;
        inset: 0;
        background-color: #0F1923;
        z-index: 999999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        transition: opacity 0.4s ease-in-out;
        overflow: hidden;
      }

      /* Background grid */
      .splash-bg-grid {
        position: absolute;
        inset: 0;
        background-image: radial-gradient(#1E2530 1px, transparent 1px);
        background-size: 24px 24px;
        z-index: 1;
      }

      /* Scanlines */
      .splash-scanlines {
        position: absolute;
        inset: 0;
        background: repeating-linear-gradient(
          to bottom,
          transparent,
          transparent 2px,
          rgba(0, 0, 0, 0.04) 2px,
          rgba(0, 0, 0, 0.04) 3px
        );
        z-index: 2;
        pointer-events: none;
      }

      /* Content container */
      .splash-content {
        position: relative;
        z-index: 10;
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      /* Radar Animation (0.0s - 0.5s) */
      .radar-container {
        position: relative;
        width: 120px;
        height: 120px;
        margin-bottom: 24px;
      }
      .radar-circle {
        position: absolute;
        inset: 0;
        border: 1px solid rgba(249, 115, 22, 0.4);
        border-radius: 50%;
        opacity: 0;
        animation: splashFadeIn 0.5s forwards;
      }
      .radar-sweep {
        position: absolute;
        inset: 0;
        border-radius: 50%;
        background: conic-gradient(from 0deg, transparent 70%, rgba(249, 115, 22, 0.6) 100%);
        opacity: 0;
        animation: splashFadeIn 0.5s forwards, splashSpin 2s linear infinite;
      }

      /* Pings */
      .ping {
        position: absolute;
        width: 4px;
        height: 4px;
        background: #F97316;
        border-radius: 50%;
        opacity: 0;
        box-shadow: 0 0 6px #F97316;
      }
      .ping-1 { top: 20px; left: 30px; animation: pingBlink 2s infinite 0.3s; }
      .ping-2 { top: 80px; right: 25px; animation: pingBlink 2s infinite 1.1s; }
      .ping-3 { bottom: 25px; left: 50px; animation: pingBlink 2s infinite 0.7s; }

      /* Shield + Eye (0.5s - 1.2s) */
      .shield-icon {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        opacity: 0;
        transform: scale(0.6);
        animation: shieldAppear 0.7s cubic-bezier(0.16, 1, 0.3, 1) 0.5s forwards;
      }
      .shield-icon svg {
        width: 50px;
        height: 50px;
        animation: pulseIris 2s infinite ease-in-out 1.2s;
        fill: none;
        stroke: white;
        stroke-width: 1.5;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      /* Title (1.2s - 2.0s) */
      .splash-title {
        font-family: 'Share Tech Mono', monospace;
        font-size: 32px;
        color: white;
        font-weight: bold;
        letter-spacing: 2px;
        height: 38px;
        margin-bottom: 30px;
        opacity: 0; /* Controlled by JS */
      }
      .splash-cursor {
        animation: cursorBlink 0.5s infinite;
        color: #F97316;
      }

      /* Progress Bar (2.0s - 2.8s) */
      .splash-progress-container {
        width: 240px;
        height: 2px;
        background: rgba(255, 255, 255, 0.1);
        border-radius: 2px;
        overflow: hidden;
        margin-bottom: 16px;
        opacity: 0;
        animation: splashFadeIn 0.1s forwards 2s;
      }
      .splash-progress-bar {
        height: 100%;
        width: 0%;
        background: #F97316;
        animation: fillBar 0.8s ease-out forwards 2s;
      }

      /* Status Text (2.8s - 3.2s) */
      .splash-status {
        font-family: 'Share Tech Mono', monospace;
        font-size: 13px;
        color: #888;
        opacity: 0;
        animation: splashFadeIn 0.4s forwards 2.8s;
        letter-spacing: 0.5px;
      }
      .ellipsis::after {
        content: '';
        animation: ellipsisAnim 1.5s infinite steps(4, end);
      }

      /* Corners */
      .corner-text {
        position: absolute;
        bottom: 24px;
        font-family: 'Share Tech Mono', monospace;
        font-size: 11px;
        color: #444;
        z-index: 10;
        letter-spacing: 0.5px;
      }
      .corner-left { left: 32px; }
      .corner-right { right: 32px; }

      /* Keyframes */
      @keyframes splashFadeIn { to { opacity: 1; } }
      @keyframes splashSpin { 100% { transform: rotate(360deg); } }
      @keyframes pingBlink {
        0%, 100% { opacity: 0; }
        50% { opacity: 1; }
      }
      @keyframes shieldAppear {
        to { opacity: 1; transform: scale(1); }
      }
      @keyframes pulseIris {
        0% { transform: scale(1); }
        50% { transform: scale(1.05); }
        100% { transform: scale(1); }
      }
      @keyframes cursorBlink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }
      @keyframes fillBar { to { width: 100%; } }
      @keyframes ellipsisAnim {
        0% { content: ''; }
        25% { content: '.'; }
        50% { content: '..'; }
        75% { content: '...'; }
        100% { content: ''; }
      }
    </style>
  </head>
  <body class="bg-bg-warm text-charcoal font-sans select-none overflow-x-hidden" style="background-color: #0D1117;">
    
    <!-- SPLASH SCREEN -->
    <div id="sentinel-splash">
      <div class="splash-bg-grid"></div>
      <div class="splash-scanlines"></div>
      
      <div class="splash-content">
        <div class="radar-container">
          <div class="radar-circle"></div>
          <div class="radar-sweep"></div>
          <div class="ping ping-1"></div>
          <div class="ping ping-2"></div>
          <div class="ping ping-3"></div>
          <div class="shield-icon">
            <svg viewBox="0 0 24 24">
              <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
              <circle cx="12" cy="11" r="3"/>
            </svg>
          </div>
        </div>
        
        <div class="splash-title" id="splash-title"></div>
        
        <div class="splash-progress-container">
          <div class="splash-progress-bar"></div>
        </div>
        
        <div class="splash-status">ANONYMOUS UNTIL IT MATTERS<span class="ellipsis"></span></div>
      </div>

      <div class="corner-text corner-left">v1.0.0</div>
      <div class="corner-text corner-right">TEAM POWERPUFF GIRLS | ASYNC 2.0</div>
    </div>

    <!-- REACT ROOT -->
    <div id="root"></div>

    <script>
      // Typing Animation for "GHOST TRAIL" (starts at 1.2s)
      setTimeout(() => {
        const title = document.getElementById('splash-title');
        const text = "GHOST TRAIL";
        let i = 0;
        title.style.opacity = 1;
        
        const typeInterval = setInterval(() => {
          title.innerHTML = text.substring(0, i+1) + '<span class="splash-cursor">_</span>';
          i++;
          if (i >= text.length) {
            clearInterval(typeInterval);
            // Hide cursor right before splash disappears
            setTimeout(() => {
              title.innerHTML = text;
            }, 1200); 
          }
        }, 70); // ~770ms total typing time
      }, 1200);

      // Fade out splash screen at 3.6s
      setTimeout(() => {
        const splash = document.getElementById('sentinel-splash');
        splash.style.opacity = 0;
        setTimeout(() => {
          splash.style.display = 'none';
        }, 400); // Wait for CSS transition to finish
      }, 3600);
    </script>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
